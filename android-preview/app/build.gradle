plugins {
    id 'com.android.application'
}

android {
    namespace 'com.folilune.vnextpreview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.folilune.vnextpreview'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.6.0-visual-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('bundleVisualPrototype', Copy) {
    from(rootProject.file('../prototypes/vnext-complete-experience-phase-e-v06.html'))
    into(project.layout.projectDirectory.dir('src/main/assets'))
    rename { 'index.html' }
}
tasks.named('preBuild').configure { dependsOn tasks.named('bundleVisualPrototype') }
