name: FOLILUNE Android WebView durability QA
on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/folilune-android-emulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-durability:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed prototype
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android reader import and process-restart tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash android-app/scripts/run-emulator-qa.sh

      - name: Collect logs and instrumentation results
        if: always()
        run: |
          mkdir -p android-app/qa-logs
          cp /tmp/folilune-seed.log /tmp/folilune-reopen.log /tmp/folilune-logcat.txt android-app/qa-logs/ 2>/dev/null || true

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FOLILUNE-Android-Emulator-QA
          path: android-app/qa-logs/
          if-no-files-found: ignore
          retention-days: 7
