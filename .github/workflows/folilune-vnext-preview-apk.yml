name: FOLILUNE vNext Visual Preview APK

on:
  pull_request:
    paths:
      - 'android-preview/**'
      - 'prototypes/vnext-complete-experience-phase-e-v06.html'
      - '.github/workflows/folilune-vnext-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout preview source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Assemble independent vNext preview and emulator test APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s prototypes/vnext-complete-experience-phase-e-v06.html
          gradle -p android-preview --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Inspect signature, bundled source, and separate package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android-preview/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -q 'Modern Atelier'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/folilune-preview-badging.txt
          grep -q "package: name='com.folilune.vnextpreview'" /tmp/folilune-preview-badging.txt
          sha256sum "$APK" > android-preview/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publish separate, signed preview APK
        uses: actions/upload-artifact@v4
        with:
          name: FOLILUNE-vNext-v06-Android-Preview-APK
          path: |
            android-preview/app/build/outputs/apk/debug/app-debug.apk
            android-preview/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test preview APK in real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash android-preview/scripts/emulator-smoke.sh

      - name: Upload Android preview installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FOLILUNE-vNext-v06-Android-QA
          path: android-preview/qa-logs/
          if-no-files-found: ignore
          retention-days: 14
