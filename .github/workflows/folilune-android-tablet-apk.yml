name: FOLILUNE tablet debug APK
on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/folilune-android-tablet-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK at: $ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Assemble signed debug APK
        run: |
          gradle -p android-app --no-daemon --stacktrace assembleDebug

      - name: Verify actual installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -p "$APK" assets/index.html | grep -q 'FOLILUNE'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          sha256sum "$APK" > android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh "$APK"

      - name: Share debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: FOLILUNE-Tablet-Test-v12-APK
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
