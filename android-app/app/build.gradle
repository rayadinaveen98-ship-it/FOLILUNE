plugins {
    id 'com.android.application'
}

android {
    namespace 'com.folilune.tablet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.folilune.tablet'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '0.12.0-tablet-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
