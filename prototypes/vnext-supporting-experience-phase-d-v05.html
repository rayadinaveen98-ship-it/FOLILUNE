function comicReader(){return `<div class="comic-page"><div class="comic-top"><button class="back-link" data-action="library">${ic('arrowleft')} Library</button><div><span class="eyebrow">VISUAL WORLDS · SAMPLE</span><h2>The Lantern Passage</h2></div><button class="icon-button" data-action="comic-info" title="About this mode">${ic('dots')}</button></div><div class="comic-display"><div class="comic-art-wrap">${comicPanel(state.comicPage)}<span class="comic-panel-caption">${['01 · The moonlit crossing','02 · An unexpected door','03 · Beyond the passage'][state.comicPage]}</span></div><aside class="comic-notes"><span class="eyebrow">ARTWORK FIRST</span><h3>There are worlds that speak in images.</h3><p>This original illustration demonstrates how an immersive visual reader can respect the artist's composition and aspect ratio.</p><div class="comic-pages"><span>PAGE</span><strong>0${state.comicPage+1}<small> / 03</small></strong></div><div class="comic-nav"><button data-action="comic-prev" ${state.comicPage===0?'disabled':''} aria-label="Previous art page">${ic('arrowleft')}</button><button data-action="comic-next" ${state.comicPage===2?'disabled':''} aria-label="Next art page">${ic('arrow')}</button></div></aside></div><div class="comic-bottom">${ic('shield')} Visual proof only — not a live CBZ/manga parser. Art stays uncropped and manually navigable.</div></div>`}
function studyReader(){return `<div class="study-page"><div class="study-header"><div><span class="eyebrow">STUDY & IDEAS / VISUAL WORKSPACE</span><h1>Read with room <em>to think.</em></h1><p>A calm dual-pane space where thoughtful work stays connected to its source.</p></div><button class="btn" data-action="toggle-study">${ic('panel')} ${state.studyPanel?'Hide notes':'Show notes'}</button></div><div class="study-workspace ${state.studyPanel?'with-notes':''}"><article class="study-document"><div class="study-paper-top"><span>FOLILUNE • AN ORIGINAL ESSAY</span><span>DOCUMENT 01 / SAMPLE</span></div><h2>On the Art of Attention</h2><p class="study-author">A field guide to noticing what matters</p><div class="study-rule">✦</div><p><span class="drop-cap">T</span>here are moments when the world asks nothing from us but our attention. A breeze through the curtain; a sentence we read twice; the brief quiet after a difficult thought.</p><h3>01. The deliberate pause</h3><p>To study is not simply to gather. It is to make room for the meaning of what we encounter. Our minds return to some details because they feel like a door opening.</p><blockquote>“Attention is the beginning of a different kind of knowing.”</blockquote><h3>02. Returning to the page</h3><p>When we return, the same paragraph has changed, because we have changed. A thoughtful workspace should honor that conversation without standing between us and the text.</p><div class="study-end">✦ &nbsp; END OF VISUAL SAMPLE</div></article>${state.studyPanel?`<aside class="study-notes"><div class="notes-title"><span class="eyebrow">YOUR WORKSPACE</span><button class="icon-button" data-action="toggle-study" title="Close notes">${ic('x')}</button></div><h3>In the margins</h3><p class="muted">An example of a linked note panel. Real PDF anchoring, sync and export are not part of this visual prototype.</p><div class="fake-note"><span>PAGE 01 · IDEA</span><p>What does a good reading environment make easier to remember?</p></div><div class="fake-note accent"><span>REFLECTION</span><p>Leave room for questions, not just answers.</p></div><button class="btn pale-btn" data-action="notes-info">${ic('plus')} Add a note</button></aside>`:''}</div></div>`}
function settingsScreen(){return `<div class="settings-page"><span class="eyebrow">THE READING ROOM / PERSONAL SETTINGS</span><h1>Make it your own.</h1><p>Only visual preferences are interactive in this design study. Cloud sync and data controls will be designed in the later functionality phase.</p><div class="setting-cards"><div class="setting-card"><span>01 / APPEARANCE</span><h3>Your preferred atmosphere</h3><p>Choose the mood that feels best, from warm paper to night.</p><div class="theme-switch"><button data-appearance="paper" class="${state.theme==='paper'?'active':''}">☀ Paper</button><button data-appearance="night" class="${state.theme==='night'?'active':''}">☾ Night</button></div></div><div class="setting-card"><span>02 / READING</span><h3>A comfortable line</h3><p>Preview type and line spacing inside the Story Reader.</p><button class="btn" data-action="story">${ic('type')} Open reading settings ${ic('arrow')}</button></div><div class="setting-card"><span>03 / GUIDE</span><h3>Discover FOLILUNE</h3><p>Revisit a short guide to this visual prototype.</p><button class="btn" data-action="guide">${ic('spark')} Explore the guide</button></div></div></div>`}

function dDoAction(code){const [cmd,...arg]=code.split(':');const param=arg.join(':');
 if(cmd==='route'){if(['search','collections','saved','notes','settings','help','states','more','home','library','story','comic','study'].includes(param)){if(param==='collections')dState.collectionOpen='';navigate(param)}return}
 if(cmd==='open-book'){sampleBook(param);return}
 if(cmd==='clear-search'){dState.query='';render();document.querySelector('#dGlobalSearch')?.focus();return}
 if(cmd==='collection-back'){dState.collectionOpen='';return render()}
 if(cmd==='new-collection'){return dOpenDialog('collection')}
 if(cmd==='new-note'){return dOpenDialog('note')}
 if(cmd==='collection-toggle'){const col=dState.collections.find(x=>x.id===dState.collectionOpen);if(col){col.bookIds=col.bookIds.includes(param)?col.bookIds.filter(x=>x!==param):[...col.bookIds,param];dSave();render()}return}
 if(cmd==='goto-mark'){const mark=dBookmarks().find(m=>m.key===param);if(mark){state.readerBook=mark.book.id;state.readerChapter=mark.chapter;navigate('story')}return}
 if(cmd==='note-open'){const note=dState.notes.find(n=>n.id===param);if(note){dOpenDialog('note-view',note)}return}
 if(cmd==='d-font-down'||cmd==='d-font-up'){state.readerSize=Math.min(30,Math.max(16,state.readerSize+(cmd==='d-font-up'?1:-1)));persist();render();return}
 if(cmd==='d-line-down'||cmd==='d-line-up'){state.lineHeight=Math.min(2.2,Math.max(1.3,Math.round((state.lineHeight+(cmd==='d-line-up'?.08:-.08))*100)/100));persist();render();return}
 if(cmd==='d-reset-reading'){state.readerSize=19;state.lineHeight=1.72;dState.font='Georgia';persist();dSave();render();notify('Demo reading defaults restored');return}
 if(cmd==='d-contrast'){dState.contrast=dState.contrast==='high'?'default':'high';dSave();render();return}
 if(cmd==='d-motion'){dState.motion=dState.motion==='reduce'?'auto':'reduce';dSave();render();return}
 if(cmd==='status'){dState.status=param;render();return}
 if(cmd==='guide'){return showGuide()}
 if(cmd==='reset-demo-confirm'){return dOpenDialog('reset')}
 if(cmd==='import-notice'){return notify('Import real EPUB books in the separate v12 Android reader. This vNext work is design-only.')}

function dOpenDialog(type,note){const host=document.querySelector('#overlay');const title=type==='collection'?'Create a sample collection':type==='note'?'Capture a reflection':type==='note-view'?'A saved thought':'Restore sample demo';let content='';
 if(type==='collection')content=`<label class="d-label" for="dModalName">Collection name</label><input class="d-field" id="dModalName" name="name" maxlength="45" placeholder="A shelf for quiet evenings" autocomplete="off" required/><label class="d-label" for="dModalDescription">A few words about this shelf</label><textarea class="d-field" id="dModalDescription" maxlength="160" placeholder="What belongs here?"></textarea>`;
 if(type==='note')content=`<label class="d-label" for="dModalName">Your reflection</label><textarea class="d-field" id="dModalName" name="name" maxlength="450" minlength="5" placeholder="What stayed with you?" required></textarea><p>Saved into this design prototype only, not attached to a real EPUB location.</p>`;
 if(type==='note-view')content=`<p style="font:italic 19px/1.6 Georgia,serif">“${esc(note.body)}”</p><span class="page-kicker">${esc(note.source)} · SAMPLE</span>`;
 if(type==='reset')content=`<p>This resets only the sample collections and reflections, along with extra visual preferences stored by the vNext Phase D design prototype. It cannot delete your actual v12 Android books or bookmarks.</p>`;
 host.innerHTML=`<div class="d-dialog-back" id="dDialogBackdrop"><section class="d-dialog" role="dialog" aria-modal="true" aria-labelledby="dDialogTitle"><span class="page-kicker">FOLILUNE · VISUAL STUDY</span><h2 id="dDialogTitle">${title}</h2><p>${type==='collection'?'Give your personal shelf a thoughtful name.':type==='note'?'Save an original thought to the sample commonplace book.':type==='note-view'?'A sample reflection kept close to its reading source.':'Are you sure you want to restore the sample data?'}</p><form id="dDialogForm" novalidate>${content}<div class="d-error-text" id="dDialogError" role="status" aria-live="polite"></div><div class="d-dialog-actions"><button type="button" class="btn" id="dCancelDialog">${type==='note-view'?'Close':'Cancel'}</button>${type!=='note-view'?`<button type="submit" class="btn primary">${type==='reset'?'Restore demo':'Save sample'} ${ic('arrow')}</button>`:''}</div></form></section></div>`;
 host.querySelector('#dCancelDialog').onclick=dCloseDialog;host.querySelector('#dDialogBackdrop').addEventListener('click',e=>{if(e.target.id==='dDialogBackdrop')dCloseDialog()});host.querySelector('#dDialogForm').addEventListener('submit',e=>{e.preventDefault();if(type==='reset'){dState.collections=D_SEED_COLLECTIONS.map(x=>({...x,bookIds:[...x.bookIds]}));dState.notes=D_SEED_NOTES.map(x=>({...x}));dSave();dCloseDialog();render();notify('Sample data restored');return}const field=host.querySelector('#dModalName');const val=field?.value.trim()||'';if((type==='note'&&val.length<5)||(type==='collection'&&val.length<2)){host.querySelector('#dDialogError').textContent=type==='note'?'Write at least five characters.':'Enter a collection name with at least two characters.';field.focus();return}if(type==='collection'){const id='custom-'+Date.now();dState.collections.push({id,name:val.slice(0,45),description:(host.querySelector('#dModalDescription').value||'Your own quiet shelf.').trim().slice(0,160),tone:'moss',bookIds:[]});dState.collectionOpen=id}else if(type==='note'){dState.notes.unshift({id:'custom-'+Date.now(),type:'Reflection',bookId:'atlas',chapter:state.readerChapter,body:val.slice(0,450),source:'Your original reflection · Demo notebook',sample:false})}dSave();dCloseDialog();render();notify(type==='note'?'Demo reflection saved':'Demo collection created')});host.querySelector('#dModalName')?.focus();if(type==='note-view')host.querySelector('#dCancelDialog').focus();}
function dCloseDialog(){const host=document.querySelector('#overlay');if(host.querySelector('.d-dialog-back'))host.innerHTML='';}
function dSetup(){dSave();document.querySelectorAll('[data-d-action]').forEach(el=>el.addEventListener('click',()=>dDoAction(el.dataset.dAction)));
 document.querySelectorAll('[data-d-scope]').forEach(el=>el.addEventListener('click',()=>{dState.searchScope=el.dataset.dScope;render();document.querySelector('#dGlobalSearch')?.focus()}));
 document.querySelectorAll('[data-d-note-filter]').forEach(el=>el.addEventListener('click',()=>{dState.noteFilter=el.dataset.dNoteFilter;dSave();render()}));
 document.querySelectorAll('[data-d-setting]').forEach(el=>el.addEventListener('click',()=>{dState.section=el.dataset.dSetting;dSave();render()}));
 document.querySelectorAll('[data-d-status]').forEach(el=>el.addEventListener('click',()=>{dState.status=el.dataset.dStatus;render()}));
 document.querySelectorAll('[data-d-collection]').forEach(el=>el.addEventListener('click',()=>{dState.collectionOpen=el.dataset.dCollection;render()}));
 document.querySelectorAll('[data-d-result]').forEach(el=>el.addEventListener('click',()=>{const [kind,id]=el.dataset.dResult.split(':');if(kind==='book')sampleBook(id);if(kind==='collection'){dState.collectionOpen=id;navigate('collections')}if(kind==='note'){dState.noteFilter='all';navigate('notes');dOpenDialog('note-view',dState.notes.find(n=>n.id===id))}}));
 const search=document.querySelector('#dGlobalSearch');if(search)search.addEventListener('input',()=>{dState.query=search.value;document.querySelector('#dSearchResults').innerHTML=dResults();document.querySelectorAll('#dSearchResults [data-d-result]').forEach(el=>el.addEventListener('click',()=>{const [kind,id]=el.dataset.dResult.split(':');if(kind==='book')sampleBook(id);if(kind==='collection'){dState.collectionOpen=id;navigate('collections')}if(kind==='note'){navigate('notes');dOpenDialog('note-view',dState.notes.find(n=>n.id===id))}}));document.querySelectorAll('#dSearchResults [data-d-action]').forEach(el=>el.addEventListener('click',()=>dDoAction(el.dataset.dAction)))});
 const noteSearch=document.querySelector('#dNoteSearch');if(noteSearch)noteSearch.addEventListener('input',()=>{dState.noteQuery=noteSearch.value;const notes=dState.notes.filter(n=>(dState.noteFilter==='all'||n.type.toLowerCase()===dState.noteFilter)&&`${n.body} ${n.source}`.toLocaleLowerCase().includes(dState.noteQuery.toLocaleLowerCase()));document.querySelector('#dNotesResults').innerHTML=notes.length?notes.map(dNoteCard).join(''):dEmpty('pencil','No notes found','Try a different phrase.','New reflection','new-note');document.querySelectorAll('#dNotesResults [data-d-action]').forEach(el=>el.addEventListener('click',()=>dDoAction(el.dataset.dAction)))});
 const help=document.querySelector('#dHelpSearch');if(help)help.addEventListener('input',()=>{dState.helpQuery=help.value;document.querySelector('#dHelpResults').innerHTML=dHelpResults()});
 const sel=[['#dDensity','density'],['#dFont','font']];for(const [id,prop] of sel){const e=document.querySelector(id);if(e)e.onchange=()=>{dState[prop]=e.value;dSave();render()}}
 const lib=document.querySelector('#dLibraryLayout');if(lib)lib.onchange=()=>{state.libraryLayout=lib.value;persist();render()};
}

function render(){document.documentElement.dataset.theme=state.theme;const app=document.querySelector('#app');app.innerHTML=shell();app.dataset.screen=state.screen;document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action,el)));
 document.querySelectorAll('[data-book]').forEach(el=>el.addEventListener('click',()=>sampleBook(el.dataset.book)));
 document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.filter;render();}));
 document.querySelectorAll('[data-layout]').forEach(el=>el.addEventListener('click',()=>{state.libraryLayout=el.dataset.layout;render();}));
 document.querySelectorAll('[data-appearance]').forEach(el=>el.addEventListener('click',()=>setTheme(el.dataset.appearance)));
 document.querySelectorAll('[data-panel]').forEach(el=>el.addEventListener('click',()=>{state.readerPanel=state.readerPanel===el.dataset.panel?'none':el.dataset.panel;render()}));
 document.querySelectorAll('[data-chapter]').forEach(el=>el.addEventListener('click',()=>{state.readerChapter=Number(el.dataset.chapter);state.readerPanel='none';persist();render()}));
 const sort=document.querySelector('#sortBooks');if(sort)sort.addEventListener('change',()=>{state.sort=sort.value;render()});

function action(a,el){switch(a){case 'search':case 'collections':case 'saved':case 'notes':case 'help':case 'states':case 'more':return navigate(a);case 'home':case 'library':case 'story':case 'comic':case 'study':case 'settings':return navigate(a);
case 'toggle-nav':state.navOpen=!state.navOpen;return render();
case 'theme':return setTheme(state.theme==='paper'?'night':'paper');
case 'search-open':navigate('search');document.querySelector('#dGlobalSearch')?.focus();return;
case 'open-atlas':state.readerBook='atlas';return navigate('story');
case 'import-info':return notify('This is a visual study. Import a DRM-free EPUB in the existing FOLILUNE v12 tablet test app.');
case 'clear-filters':state.search='';state.filter='All';return render();
case 'close-panel':state.readerPanel='none';return render();
case 'bookmark':{const key=state.readerBook+'-'+state.readerChapter;state.bookmarks=state.bookmarks.includes(key)?state.bookmarks.filter(x=>x!==key):[...state.bookmarks,key];persist();notify(state.bookmarks.includes(key)?'Sample chapter bookmarked':'Bookmark removed');return render();}
case 'font-up':case 'font-down':state.readerSize=Math.min(30,Math.max(16,state.readerSize+(a==='font-up'?1:-1)));persist();return render();
case 'line-up':case 'line-down':state.lineHeight=Math.min(2.2,Math.max(1.3,Math.round((state.lineHeight+(a==='line-up'?.08:-.08))*100)/100));persist();return render();
case 'reset-reader':state.readerSize=19;state.lineHeight=1.72;persist();return render();

case 'comic-next':state.comicPage=Math.min(2,state.comicPage+1);persist();return render();
case 'comic-prev':state.comicPage=Math.max(0,state.comicPage-1);persist();return render();
case 'comic-info':return notify('Original art is a visual design proof. A true comic engine is planned for a later functionality release.');
case 'toggle-study':state.studyPanel=!state.studyPanel;persist();return render();
case 'notes-info':return notify('Source-anchored note creation is planned for the functionality update. This is only the visual layout.');
case 'guide':return showGuide();
default:return notify('This interaction is planned for a later phase.');}}

let guideIndex=0;
function showGuide(){guideIndex=0;guideRender();}
function guideRender(){const [title,copy]=guideCopy[guideIndex];const host=document.querySelector('#overlay');host.innerHTML=`<div class="overlay-scrim" id="guideScrim"><section class="guide-dialog" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><span class="eyebrow">THE FOLILUNE TOUR · ${guideIndex+1} / 3</span><div class="guide-symbol">${logo()}</div><h2 id="guideTitle">${title}</h2><p>${copy}</p><div class="guide-steps">${guideCopy.map((_,i)=>`<i class="${i===guideIndex?'active':''}"></i>`).join('')}</div><div class="guide-buttons"><button class="btn" id="guideSkip">Skip</button><div><button class="btn" id="guideBack" ${guideIndex===0?'disabled':''}>Back</button><button class="btn primary" id="guideNext">${guideIndex===2?'Finish':'Continue'} ${ic('arrow')}</button></div></div></section></div>`;host.querySelector('#guideSkip').onclick=hideGuide;host.querySelector('#guideBack').onclick=()=>{guideIndex=Math.max(0,guideIndex-1);guideRender()};host.querySelector('#guideNext').onclick=()=>{if(guideIndex===2){hideGuide();return}guideIndex++;guideRender()};host.querySelector('#guideScrim').addEventListener('click',e=>{if(e.target.id==='guideScrim')hideGuide()});host.querySelector('#guideNext').focus();}
function hideGuide(){document.querySelector('#overlay').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideGuide();state.readerPanel='none';render()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('search');document.querySelector('#dGlobalSearch')?.focus()}});
document.documentElement.dataset.theme=state.theme;render();
</script></body></html>
