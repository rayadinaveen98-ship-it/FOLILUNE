'use strict';
const MARK=`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M89 24C67 13 42 31 36 57" fill="none" stroke="currentColor" stroke-width="6.2" stroke-linecap="round"/><path d="M24 76Q43 68 60 84Q77 68 96 76V98Q76 91 60 106Q44 91 24 98Z" fill="none" stroke="currentColor" stroke-width="5.6" stroke-linejoin="round"/><path d="M60 84V105" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></svg>`;
const icons={moon:`<path d="M20.4 15.6A8 8 0 0 1 8.4 3.6 8.5 8.5 0 1 0 20.4 15.6Z"/>`,sun:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>`,arrow:`<path d="M4 12h16m-6-6 6 6-6 6"/>`,back:`<path d="M20 12H4m6-6-6 6 6 6"/>`,book:`<path d="M12 6C8 4 5 4 2 5v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-3-1-6-1-10 1zm0 0v14"/>`,spark:`<path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"/>`,file:`<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 14h8m-8 4h6"/>`,check:`<path d="m5 12 4 4L19 6"/>`,layers:`<path d="m12 3 9 6-9 6-9-6 9-6Zm-9 11 9 6 9-6M3 18l9 6 9-6"/>`,heart:`<path d="M20.8 4.6c-2-2-5.2-2-7.2 0L12 6.2l-1.6-1.6c-2-2-5.2-2-7.2 0-2 2-2 5.2 0 7.2L12 20.6l8.8-8.8c2-2 2-5.2 0-7.2Z"/>`,settings:`<path d="M4 7h16M4 17h16M9 4v6m6 4v6"/>`,library:`<path d="M4 3h4v18H4zM11 3h4v18h-4zM17 6h4v15h-4z"/>`,shield:`<path d="m12 2 9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6l9-4Z"/>`,plus:`<path d="M12 5v14M5 12h14"/>`};
function ic(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.book}</svg>`}
function artScene(){return `<div class="art" aria-hidden="true"><svg class="world" viewBox="0 0 700 680" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#466955"/><stop offset="1" stop-color="#18312a"/></linearGradient><radialGradient id="halo"><stop stop-color="#f7e7b8"/><stop offset=".8" stop-color="#f7e1ab"/><stop offset="1" stop-color="#f8e1a8" stop-opacity=".5"/></radialGradient><linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ebce"/><stop offset="1" stop-color="#e1c99c"/></linearGradient></defs><rect width="700" height="680" fill="url(#sea)"/><g class="little-stars" fill="#f2e1b1"><circle cx="91" cy="92" r="2"/><circle cx="191" cy="151" r="1.5"/><circle cx="548" cy="106" r="2"/><circle cx="606" cy="215" r="1.3"/><circle cx="330" cy="65" r="1.4"/><circle cx="90" cy="269" r="1.4"/><circle cx="463" cy="250" r="1.1"/><circle cx="633" cy="342" r="1.2"/></g><g class="moon"><circle cx="463" cy="205" r="116" fill="#f5dfa6" opacity=".08"/><circle cx="463" cy="205" r="91" fill="#f5dfa6" opacity=".11"/><circle cx="463" cy="205" r="66" fill="url(#halo)"/><circle cx="480" cy="195" r="65" fill="#3a5d4a" opacity=".29"/></g><path d="M0 408Q120 327 241 385T483 373T700 398V680H0Z" fill="#40654d" opacity=".60"/><path d="M0 477Q190 377 323 442T700 419V680H0Z" fill="#2d4f3f"/><path d="M0 536Q118 459 290 496T700 475V680H0Z" fill="#1e3f33"/><g opacity=".6" stroke="#d7bd8b" stroke-width="1.7" fill="none"><path d="M112 580q-12-76-51-129m51 129q19-44 9-92m25 92q29-61 75-83m-75 83q-16-53-8-102"/><path d="M588 572q23-81 74-109m-74 109q-5-62-35-91"/></g><g class="book-leaf"><path d="M138 536Q260 475 355 537Q454 475 575 536L566 610Q453 566 355 623Q260 568 146 610Z" fill="#f4e8cd" stroke="#c1a87d" stroke-width="4"/><path d="M355 535V623" stroke="#9e886b" stroke-width="3"/><path d="M170 546Q260 519 329 549m-151 15q81-24 151 3m49-18q76-30 167-3m-160 21q87-25 156-4" fill="none" stroke="#a79d86" stroke-width="2" opacity=".65"/></g><path d="M0 628Q174 584 363 628T700 613V680H0Z" fill="#152f28" opacity=".95"/></svg><div class="motto"><span>A little farther into the story.</span><span>FOLILUNE / EST. 2026</span></div></div>`}
const sampleParagraphs=[`Some doors do not open into rooms. They open into the small, unguarded places inside us—places we might otherwise walk past without noticing.`,`On the first morning of winter, Mira found the map beneath a stack of letters. There was no legend, no compass, only a drawing of a shoreline she had never seen and a sentence written in unfamiliar ink.`,`She read it aloud once, softly. Outside, the trees answered with the patient sound of leaves turning.`];
const STORE='folilune_vnext_phaseb_v03';
const defaults={seen:false,intents:[],theme:'paper',textSize:18,guideSeen:false};
let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
const state={...defaults,...(saved&&typeof saved==='object'?saved:{})};
let screen=state.seen?'home':'arrival',guide=-1,splashTimer=null,toastTimer=null;
function persist(){try{localStorage.setItem(STORE,JSON.stringify({seen:state.seen,intents:state.intents,theme:state.theme,textSize:state.textSize,guideSeen:state.guideSeen}))}catch(e){}}
function theme(t){state.theme=t;document.documentElement.dataset.theme=t;persist();document.querySelector('#themeTop').innerHTML=ic(t==='night'?'sun':'moon');document.querySelector('#themeTop').setAttribute('aria-label',t==='night'?'Switch to paper theme':'Switch to night theme');}
function notify(msg){let el=document.querySelector('#toastMount');el.innerHTML=`<div class="toast">${msg}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',3300)}
function nav(name){screen=name;render();window.scrollTo(0,0);}
function openSplash(next='arrival'){clearTimeout(splashTimer);const root=document.querySelector('#splashMount');root.innerHTML=`<div class="splash" role="dialog" aria-modal="true" aria-label="FOLILUNE welcome animation"><button type="button" class="skip-splash" data-action="skip-splash">Skip intro</button><div class="splash-brand">${MARK}<h2>FOLILUNE</h2><p>A world between pages</p></div><div class="splash-foot">a quiet place to begin</div></div>`;const finish=()=>{if(!root.firstChild)return;root.innerHTML='';nav(next)};root.querySelector('[data-action=skip-splash]').onclick=finish;let ms=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:1650;splashTimer=setTimeout(finish,ms)}
function intro(){return `<section class="screen arrival"><div class="arrival-copy"><span class="eyebrow">Your own reading sanctuary</span><h1>Every page has a world waiting.</h1><p class="lede">Keep the stories you love close. Read at your own pace, discover what matters, and make room for a little wonder.</p><div class="arrival-choices"><button class="btn primary" data-action="start">Find your reading rhythm ${ic('arrow')}</button><button class="btn" data-action="skip">Explore without setup</button></div><span class="tinytrust">${ic('shield')} Your books stay yours. No account required to begin.</span></div>${artScene()}</section><div class="arriv-foot"><span>01 / A gentle beginning</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Skip whenever you wish</span></div>`}
function firstStage(){const opts=[['stories','book','Stories','Novels, essays & long reads'],['visual','spark','Visual worlds','Comics, manga & art'],['study','layers','Study & ideas','Learn, explore & annotate']];return `<section class="screen flow"><div class="flow-left"><div class="stephead"><span class="eyebrow">Your reading rhythm</span><span class="steps">01 / 03</span></div><h2 class="flow-title">What brings you here?</h2><p class="flow-copy">A little guidance helps us shape your first visit. Select anything you enjoy—or skip and explore freely.</p><div class="choice-grid">${opts.map(([id,icon,title,desc])=>`<button type="button" class="choice" data-intent="${id}" aria-pressed="${state.intents.includes(id)}"><span class="choice-icon">${ic(icon)}</span><b>${title}</b><small>${desc}</small></button>`).join('')}</div><div class="step-actions"><button class="btn primary" data-action="next-comfort">Continue ${ic('arrow')}</button><button class="textbtn" data-action="skip">Skip setup</button></div><div class="path-note">Preferences are only used in this design preview. We'll personalize the real app after you approve the experience.</div></div><div class="flow-right">${artScene()}</div></section>`}
function comfort(){return `<section class="screen flow"><div class="flow-left"><div class="stephead"><span class="eyebrow">Made for your eyes</span><span class="steps">02 / 03</span></div><h2 class="flow-title">Find your kind of quiet.</h2><p class="flow-copy">Start with a comfortable page. These choices are never permanent; you can adjust them whenever you read.</p><div class="comfort-stage"><div class="comfort-settings"><span class="comfort-title">Reading atmosphere</span><div class="comfort-choice"><button class="theme-choice" data-theme-choice="paper" aria-pressed="${state.theme==='paper'}"><span class="theme-tile"></span>Paper</button><button class="theme-choice" data-theme-choice="night" aria-pressed="${state.theme==='night'}"><span class="theme-tile"></span>Night</button></div><span class="comfort-title">Text comfort</span><div class="size-row"><button class="iconbtn" aria-label="Smaller sample text" data-action="font-down">A−</button><output id="fontOutput">${state.textSize}px</output><button class="iconbtn" aria-label="Larger sample text" data-action="font-up">A+</button></div><p class="path-note">Our actual EPUB reader respects each book’s formatting; this is a preview of your preferred starting size.</p></div><article class="prose-sheet" id="prosePreview" style="--preview-size:${state.textSize}px"><span class="overline">Preview / The first line</span><h3>A quieter place.</h3><p>There is a certain magic to finding just the right page at just the right moment.</p></article></div><div class="step-actions"><button class="btn" data-action="back-intents">${ic('back')} Back</button><button class="btn primary" data-action="next-shelf">Continue ${ic('arrow')}</button><button class="textbtn" data-action="skip">Skip setup</button></div></div><div class="flow-right">${artScene()}</div></section>`}
function shelf(){return `<section class="screen flow"><div class="flow-left"><div class="stephead"><span class="eyebrow">A library of your own</span><span class="steps">03 / 03</span></div><h2 class="flow-title">Start with one story.</h2><p class="flow-copy">You can explore an original sample or bring your own book later. There’s no need to organize everything today.</p><div class="import-panel"><div class="import-card"><div class="mini-cover">A Map of<br>Small Wonders</div><h3>A Map of Small Wonders</h3><p>An original three-paragraph reading sample prepared for this experience.</p><button class="btn primary" data-action="sample">Open sample ${ic('arrow')}</button></div><div class="import-card"><span class="choice-icon" style="width:47px;height:47px;border-radius:14px;background:var(--sage);display:grid;place-items:center;color:var(--moss)">${ic('file')}</span><h3>Bring your own book</h3><p>In the real app, your files will open with our locally tested reader.</p><button class="btn" data-action="file-demo">See import note ${ic('arrow')}</button><p class="filehint">This design preview does not parse or store EPUB files.</p></div></div><div class="step-actions"><button class="btn" data-action="back-comfort">${ic('back')} Back</button><button class="btn primary" data-action="finish">Enter FOLILUNE ${ic('arrow')}</button></div></div><div class="flow-right">${artScene()}</div></section>`}
function home(){return `<section class="screen home"><nav class="rail" aria-label="Main navigation"><div class="tiny">Explore</div><button class="selected" data-action="home" aria-current="page">${ic('book')} <span class="rail-label">Home</span></button><button data-action="library">${ic('library')} <span class="rail-label">Library</span></button><button data-action="open-reader">${ic('layers')} <span class="rail-label">Read sample</span></button><button data-action="setup-again">${ic('settings')} <span class="rail-label">Preferences</span></button></nav><div class="home-content"><span class="eyebrow">A place for every kind of story</span><h2 style="margin:12px 0 23px">Welcome to your corner of the world.</h2><div class="home-hero" id="resumeSpot"><div class="text-area"><span class="eyebrow">Your first page</span><h1>A quieter place awaits.</h1><p>Start with an original story sample, or return when you're ready to bring your own book.</p><button class="btn primary" data-action="open-reader">Begin reading ${ic('arrow')}</button></div>${artScene()}</div><div class="sectionhead"><h2>Your reading spaces</h2><small>Created for what you love</small></div><div class="shelves" id="shelvesSpot"><div class="shelf"><div class="book">Story</div><div><h3>Stories</h3><p>Words worth getting lost in.</p></div></div><div class="shelf"><div class="book">Art</div><div><h3>Visual worlds</h3><p>A place for illustrated stories.</p></div></div><div class="shelf"><div class="book">Ideas</div><div><h3>Study & ideas</h3><p>Reading with room to think.</p></div></div></div><div class="sectionhead" style="margin-top:31px"><h2>Make it yours, gently.</h2></div><p class="muted" style="max-width:690px;font-size:14px">Nothing to set up all at once. The library, reading tools and personal settings reveal themselves when useful.</p><button class="btn" id="guideSpot" data-action="show-guide">Take the 30-second guide ${ic('arrow')}</button></div></section>`}
function reader(){return `<section class="screen reader"><div class="reader-top"><button class="btn" data-action="home">${ic('back')} Back to Home</button><span class="eyebrow">Original demo text · Visual preview</span><button class="iconbtn" data-action="theme" aria-label="Switch reading theme">${ic(state.theme==='night'?'sun':'moon')}</button></div><article class="reader-paper" style="--preview-size:${state.textSize}px"><div class="kicker">Chapter 01 · The first line</div><h1>A Map of Small Wonders</h1>${sampleParagraphs.map(t=>`<p>${t}</p>`).join('')}<div class="small-end">✧</div></article><div class="reading-tools"><button class="btn" data-action="font-down">A− Smaller</button><button class="btn" data-action="font-up">A+ Larger</button><button class="btn" data-action="show-guide">${ic('spark')} Show guide</button></div><div class="read-note">This is original text for visual and onboarding review. The EPUB.js engine is in the separate v12 Android prototype.</div></section>`}
function library(){return `<section class="screen empty-view"><span class="eyebrow">A growing collection</span><h2>Your library starts here.</h2><p class="muted">This is the Phase B design review. We keep your original EPUB collection and import engine safely in the existing v12 app while refining the new experience.</p><button class="btn primary" data-action="open-reader">Open original sample ${ic('arrow')}</button><button class="btn" data-action="home" style="margin-left:9px">Back to Home</button></section>`}
function render(){const host=document.querySelector('#screen');host.innerHTML=({arrival:intro,intents:firstStage,comfort,shelf,home,reader,library})[screen]?.()||home();document.body.dataset.screen=screen;document.querySelectorAll('[data-intent]').forEach(b=>{b.onclick=()=>{const id=b.dataset.intent;state.intents=state.intents.includes(id)?state.intents.filter(x=>x!==id):[...state.intents,id];persist();document.querySelectorAll('[data-intent]').forEach(x=>x.setAttribute('aria-pressed',state.intents.includes(x.dataset.intent)))} });document.querySelectorAll('[data-theme-choice]').forEach(b=>{b.onclick=()=>{theme(b.dataset.themeChoice);render()}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.documentElement.style.setProperty('--preview-size',state.textSize+'px')}
function finish(){state.seen=true;persist();nav('home');if(!state.guideSeen){guide=0;showGuide()}}
const guideCopy=[{title:'Your next page, one tap away',copy:'Start here whenever you want to return to reading. In the real app, this becomes your genuine Continue Reading card.'},{title:'Spaces for different kinds of reading',copy:'Stories, illustrated works and thoughtful study can each have a place, without crowding your Home screen.'},{title:'Everything else waits until you need it',copy:'You can always find your Library, settings and reading tools. The interface stays quiet while your book has the spotlight.'}];
function showGuide(){if(guide<0){document.querySelector('#guideMount').innerHTML='';return}const c=guideCopy[guide];document.querySelector('#guideMount').innerHTML=`<div class="guide" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><div class="guide-card"><div class="guide-visual" aria-hidden="true">${guideCopy.map((_,i)=>`<i class="${i===guide?'on':''}"></i>`).join('')}</div><span class="guide-step">A little tour · ${guide+1} of 3</span><h2 id="guideTitle">${c.title}</h2><p>${c.copy}</p><div class="guide-actions"><button class="textbtn" data-guide="skip">Skip guide</button><div style="display:flex;gap:9px"><button class="btn" data-guide="back" ${guide===0?'disabled':''}>${ic('back')} Back</button><button class="btn primary" data-guide="next">${guide===guideCopy.length-1?'Finish tour':'Continue'} ${ic('arrow')}</button></div></div></div></div>`;document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{const a=b.dataset.guide;if(a==='skip'||a==='next'&&guide===guideCopy.length-1){guide=-1;state.guideSeen=true;persist();showGuide();return}guide+=(a==='back'?-1:1);showGuide()});document.querySelector('#guideTitle')?.focus?.()}
function action(a){switch(a){case 'start':return nav('intents');case 'skip':case 'finish':return finish();case 'next-comfort':return nav('comfort');case 'next-shelf':return nav('shelf');case 'back-intents':return nav('intents');case 'back-comfort':return nav('comfort');case 'home':return nav('home');case 'open-reader':case 'sample':state.seen=true;persist();return nav('reader');case 'library':return nav('library');case 'file-demo':return notify('Import is not enabled in this design preview. The existing v12 Android app handles real EPUB files.');case 'font-up':case 'font-down':state.textSize=Math.max(16,Math.min(30,state.textSize+(a==='font-up'?1:-1)));persist();document.documentElement.style.setProperty('--preview-size',state.textSize+'px');if(screen==='comfort')return render();return;case 'theme':return theme(state.theme==='paper'?'night':'paper');case 'show-guide':guide=0;return showGuide();case 'setup-again':return nav('intents');default:return notify('That action is part of a later product phase.')}}
function reset(){clearTimeout(splashTimer);guide=-1;showGuide();state.seen=false;state.guideSeen=false;state.intents=[];state.textSize=18;persist();openSplash('arrival')}
document.querySelector('#brandIcon').innerHTML=MARK;document.querySelector('#themeTop').onclick=()=>{theme(state.theme==='paper'?'night':'paper');render()};document.querySelector('#replay').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&guide>=0){guide=-1;state.guideSeen=true;persist();showGuide()}});theme(state.theme);render();if(!state.seen)openSplash('arrival');
</script>
</body></html>
